# =============================================================================
# ROADALERT — Surcharge PRODUCTION
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Les URLs / secrets viennent du .env du serveur (NODE_ENV=production).
# =============================================================================

services:
  backend:
    build:
      target: production
    environment:
      NODE_ENV: production
    restart: unless-stopped

  proxy:
    restart: unless-stopped
    ports:
      - "80:80"
