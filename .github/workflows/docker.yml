name: Build Docker

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3
      
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Construire l'image Docker (Simulation sans publication)
        uses: docker/build-push-action@v3
        with:
          context: ./backend
          push: false
          tags: roadalert-backend:latest
