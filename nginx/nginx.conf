worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Redirection HTTP vers HTTPS
    server {
        listen 80;
        server_name api.roadalert.com admin.roadalert.com;
        return 301 https://$host$request_uri;
    }

    # Configuration du Backend API (HTTPS)
    server {
        listen 443 ssl;
        server_name api.roadalert.com;

        ssl_certificate /etc/nginx/certs/roadalert.com.crt;
        ssl_certificate_key /etc/nginx/certs/roadalert.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
