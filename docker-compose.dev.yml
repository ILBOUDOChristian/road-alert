version: '3.8'

services:
  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "${PORT:-3001}:3000"
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-roadalert}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: ${DB_NAME:-roadalert}
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    ports:
      - "8081:80"
      - "4443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  adminer:
    image: adminer
    restart: always
    ports:
      - "8888:8080"
    depends_on:
      - db
